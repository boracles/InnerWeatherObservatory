<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Portable Weather Station — Babylon.js</title>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<link rel="stylesheet" href="_ds/classical-a30268d5-4d32-4be7-8ebd-4aeeaea2cd7f/styles.css">
<style>
  html,body{margin:0;height:100%;background:#141110;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;outline:none;touch-action:none}
  #tag{position:fixed;left:18px;bottom:14px;font-family:var(--font-body,Georgia,serif);
       font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b68235;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: false }, true);
engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 1.4));
const scene = new BABYLON.Scene(engine);
scene.useRightHandedSystem = true;                 // match three.js coordinates
const DARK = new BABYLON.Color3(0.078, 0.067, 0.063);
scene.clearColor = new BABYLON.Color4(DARK.r, DARK.g, DARK.b, 1);
scene.autoClear = true;

const V3 = (x, y, z) => new BABYLON.Vector3(x, y, z);
const hexc = (h) => BABYLON.Color3.FromHexString('#' + h.toString(16).padStart(6, '0')).toLinearSpace();

/* ---------- lighting: the same neutral studio, dimmed to a lamplit key ---------- */
const hemi = new BABYLON.HemisphericLight('hemi', V3(0, 1, 0), scene);
hemi.diffuse = new BABYLON.Color3(1, 1, 1);
hemi.groundColor = hexc(0xd8d2c4).scale(0.55);
hemi.intensity = 0.30;
hemi.specular = new BABYLON.Color3(0.1, 0.1, 0.1);

const key = new BABYLON.DirectionalLight('key', V3(-4, -7, -5).normalize(), scene);
key.position = V3(1.2, 2.1, 1.5);
key.intensity = 1.9;
const fill = new BABYLON.DirectionalLight('fill', V3(5, -3, 4).normalize(), scene);
fill.diffuse = hexc(0xfff4e6);
fill.intensity = 0.22;
fill.specular = new BABYLON.Color3(0.2, 0.2, 0.2);

const shadow = new BABYLON.ShadowGenerator(2048, key);
shadow.usePercentageCloserFiltering = true;
shadow.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
shadow.bias = 0.00035;
shadow.normalBias = 0.006;
const casters = shadow.getShadowMap().renderList;

/* ---------- material helper ---------- */
const pbr = (name, hex, rough, metal, o = {}) => {
  const m = new BABYLON.PBRMetallicRoughnessMaterial(name, scene);
  m.baseColor = hexc(hex);
  m.roughness = rough; m.metallic = metal;
  m.maxSimultaneousLights = 8;
  if (o.alpha !== undefined) { m.alpha = o.alpha; m.transparencyMode = 2; }
  if (o.double) m.backFaceCulling = false;
  if (o.noDepth) m.disableDepthWrite = true;
  if (o.emissive) m.emissiveColor = hexc(o.emissive).scale(o.emissiveIntensity || 1);
  return m;
};

const M = {
  caseWood:  pbr('caseWood',  0x4b3627, 0.85, 0.05),
  paleWood:  pbr('paleWood',  0xc3ac86, 0.80, 0.02),
  lining:    pbr('lining',    0x39415a, 0.95, 0.00),
  brass:     pbr('brass',     0xc79a4e, 0.35, 0.40),
  iron:      pbr('iron',      0x312d29, 0.60, 0.35),
  glass:     pbr('glass',     0xdfe6e6, 0.08, 0.05, { alpha: 0.22, double: true }),
  cloud:     pbr('cloud',     0xf4f2ec, 1.00, 0.00),
  linenPale: pbr('linenPale', 0xded2b8, 0.95, 0.00, { double: true }),
  linenBlue: pbr('linenBlue', 0x76809a, 0.95, 0.00, { double: true }),
  linenRust: pbr('linenRust', 0x9c5f3e, 0.95, 0.00, { double: true }),
  paper:     pbr('paper',     0xe9e2cf, 0.95, 0.00, { double: true }),
};

/* ---------- geometry helpers, mirroring the three.js scene 1:1 ---------- */
const grp = (name, parent) => {
  const n = new BABYLON.TransformNode(name, scene);
  if (parent) n.parent = parent;
  return n;
};
const finish = (m, name, parent, mat, pos, rot) => {
  m.name = name;
  if (parent) m.parent = parent;
  if (mat) m.material = mat;
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotationQuaternion = BABYLON.Quaternion.RotationYawPitchRoll(rot[1] || 0, rot[0] || 0, rot[2] || 0);
  m.receiveShadows = true;
  casters.push(m);
  return m;
};
const noCast = (m) => { const i = casters.indexOf(m); if (i >= 0) casters.splice(i, 1); return m; };

const box = (p, name, w, h, d, mat, pos, rot) =>
  finish(BABYLON.MeshBuilder.CreateBox(name, { width: w, height: h, depth: d }, scene), name, p, mat, pos, rot);
const cyl = (p, name, rt, rb, h, mat, pos, rot, seg = 32) =>
  finish(BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop: rt * 2, diameterBottom: rb * 2, height: h, tessellation: seg }, scene), name, p, mat, pos, rot);
const cone = (p, name, r, h, mat, pos, rot, seg = 24, open = false) =>
  finish(BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop: 0, diameterBottom: r * 2, height: h, tessellation: seg,
    cap: open ? BABYLON.Mesh.NO_CAP : BABYLON.Mesh.CAP_ALL, sideOrientation: open ? BABYLON.Mesh.DOUBLESIDE : undefined }, scene), name, p, mat, pos, rot);
const sph = (p, name, r, mat, pos, seg = 24, slice) =>
  finish(BABYLON.MeshBuilder.CreateSphere(name, { diameter: r * 2, segments: seg, slice, sideOrientation: slice ? BABYLON.Mesh.DOUBLESIDE : undefined }, scene), name, p, mat, pos);
// three's TorusGeometry lies in the XY plane; a tube along a circular path matches it (and takes arcs)
const torus = (p, name, R, r, mat, pos, rot, arc = Math.PI * 2, tess = 40) => {
  const path = [];
  for (let i = 0; i <= tess; i++) { const a = arc * i / tess; path.push(V3(Math.cos(a) * R, Math.sin(a) * R, 0)); }
  return finish(BABYLON.MeshBuilder.CreateTube(name, { path, radius: r, tessellation: 12, cap: BABYLON.Mesh.NO_CAP, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene), name, p, mat, pos, rot);
};
const lathe = (p, name, pts, seg, mat, pos, rot) =>
  finish(BABYLON.MeshBuilder.CreateLathe(name, { shape: pts.map(v => V3(v[0], v[1], 0)), tessellation: seg, cap: BABYLON.Mesh.NO_CAP, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene), name, p, mat, pos, rot);
const wire = (p, name, a, b, r = 0.0015, mat = M.brass) => {
  const A = V3(...a), B = V3(...b);
  const m = BABYLON.MeshBuilder.CreateTube(name, { path: [A, B], radius: r, tessellation: 6, cap: BABYLON.Mesh.NO_CAP }, scene);
  return finish(m, name, p, mat);
};
// three's PlaneGeometry, kept in plane space so the wave code ports unchanged
const planeData = (w, h, sx, sy) => {
  const pos = [], idx = [], uv = [];
  for (let iy = 0; iy <= sy; iy++) for (let ix = 0; ix <= sx; ix++) {
    pos.push(-w / 2 + w * ix / sx, h / 2 - h * iy / sy, 0);
    uv.push(ix / sx, 1 - iy / sy);
  }
  for (let iy = 0; iy < sy; iy++) for (let ix = 0; ix < sx; ix++) {
    const a = ix + (sx + 1) * iy, b = ix + (sx + 1) * (iy + 1), c = (ix + 1) + (sx + 1) * (iy + 1), d = (ix + 1) + (sx + 1) * iy;
    idx.push(a, b, d, b, c, d);
  }
  return { pos, idx, uv };
};
const planeMesh = (p, name, w, h, sx, sy, mat, pos, rot, updatable) => {
  const g = planeData(w, h, sx, sy);
  const vd = new BABYLON.VertexData();
  vd.positions = g.pos; vd.indices = g.idx; vd.uvs = g.uv;
  vd.normals = []; BABYLON.VertexData.ComputeNormals(g.pos, g.idx, vd.normals);
  const m = new BABYLON.Mesh(name, scene);
  vd.applyToMesh(m, !!updatable);
  finish(m, name, p, mat, pos, rot);
  return { mesh: m, pos: Float32Array.from(g.pos), base: Float32Array.from(g.pos), idx: g.idx, nrm: new Float32Array(g.pos.length) };
};
const flipPlane = (P) => {
  const n = P.mesh.getVerticesData(BABYLON.VertexBuffer.NormalKind);
  for (let i = 0; i < n.length; i++) n[i] = -n[i];
  P.mesh.updateVerticesData(BABYLON.VertexBuffer.NormalKind, n);
};
const reverseWinding = (P) => {
  const a = P.idx;
  for (let i = 0; i < a.length; i += 3) { const t = a[i + 1]; a[i + 1] = a[i + 2]; a[i + 2] = t; }
  P.mesh.setIndices(a);
};
const pushPlane = (P) => {
  P.mesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, P.pos);
  BABYLON.VertexData.ComputeNormals(P.pos, P.idx, P.nrm);
  P.mesh.updateVerticesData(BABYLON.VertexBuffer.NormalKind, P.nrm);
};

const root = grp('weatherStation');

/* ---------- suitcase ---------- */
const CW = 0.74, CD = 0.44, CH = 0.19;
const TOP = CH;
const caseG = grp('suitcase', root);

box(caseG, 'caseFloor', CW, 0.022, CD, M.caseWood, [0, 0.011, 0]);
box(caseG, 'caseWallBack', CW, CH, 0.020, M.caseWood, [0, CH / 2, -CD / 2 + 0.01]);
box(caseG, 'caseWallFrontL', 0.320, CH, 0.020, M.caseWood, [-0.210, CH / 2, CD / 2 - 0.01]);
box(caseG, 'caseWallFrontR', 0.100, CH, 0.020, M.caseWood, [0.320, CH / 2, CD / 2 - 0.01]);
box(caseG, 'caseWallFrontTop', 0.320, 0.090, 0.020, M.caseWood, [0.110, 0.145, CD / 2 - 0.01]);
box(caseG, 'caseWallFrontSill', 0.320, 0.026, 0.020, M.caseWood, [0.110, 0.013, CD / 2 - 0.01]);
box(caseG, 'caseWallLeft', 0.020, CH, CD, M.caseWood, [-CW / 2 + 0.01, CH / 2, 0]);
box(caseG, 'caseWallRight', 0.020, CH, CD, M.caseWood, [CW / 2 - 0.01, CH / 2, 0]);
box(caseG, 'caseLining', CW - 0.04, 0.004, CD - 0.04, M.lining, [0, 0.0265, 0]);
for (const sx of [-1, 1]) for (const sz of [-1, 1])
  box(caseG, 'cornerCap', 0.05, 0.05, 0.05, M.iron, [sx * (CW / 2 - 0.02), 0.02, sz * (CD / 2 - 0.02)]);
box(caseG, 'beltBandL', 0.03, CH + 0.004, CD + 0.004, M.iron, [-0.19, CH / 2, 0]);
box(caseG, 'beltBandR', 0.03, CH + 0.004, CD + 0.004, M.iron, [0.315, CH / 2, 0]);

const handle = grp('handle', caseG);
torus(handle, 'handleStrap', 0.055, 0.010, M.caseWood, [0, 0.152, CD / 2 + 0.012], [0, 0, Math.PI], Math.PI, 28);
for (const sx of [-1, 1]) box(handle, 'handleMount', 0.024, 0.042, 0.014, M.iron, [sx * 0.055, 0.150, CD / 2 + 0.006]);

const FZ = CD / 2;
const latchRig = (x) => {
  const g = grp('latch', caseG); g.position.x = x;
  box(g, 'latchPlate', 0.062, 0.050, 0.006, M.iron, [0, 0.148, FZ + 0.002]);
  for (const sx of [-1, 1]) for (const sy of [-1, 1])
    sph(g, 'latchRivet', 0.0042, M.brass, [sx * 0.023, 0.148 + sy * 0.017, FZ + 0.006], 12);
  cyl(g, 'latchHinge', 0.005, 0.005, 0.040, M.brass, [0, 0.166, FZ + 0.008], [0, 0, Math.PI / 2], 16);
  const hasp = grp('hasp', g);
  hasp.position.set(0, 0.166, FZ + 0.008); hasp.rotation.x = 0.12;
  box(hasp, 'haspArm', 0.030, 0.056, 0.005, M.brass, [0, -0.028, 0.001]);
  box(hasp, 'haspSlot', 0.010, 0.020, 0.008, M.iron, [0, -0.046, 0.000]);
  cyl(hasp, 'haspTip', 0.015, 0.015, 0.005, M.brass, [0, -0.056, 0.001], [Math.PI / 2, 0, 0], 20);
  box(g, 'catchPlate', 0.034, 0.026, 0.005, M.iron, [0, 0.100, FZ + 0.002]);
  torus(g, 'catchStaple', 0.008, 0.0028, M.brass, [0, 0.104, FZ + 0.007], [Math.PI / 2, 0, 0], Math.PI * 2, 20);
  cyl(g, 'escutcheon', 0.013, 0.013, 0.006, M.brass, [0, 0.074, FZ + 0.001], [Math.PI / 2, 0, 0], 24);
  cyl(g, 'keyholeBore', 0.0035, 0.0035, 0.005, M.iron, [0, 0.077, FZ - 0.0005], [Math.PI / 2, 0, 0], 14);
  box(g, 'keyholeSlot', 0.0035, 0.008, 0.005, M.iron, [0, 0.071, FZ - 0.0005]);
};
latchRig(-0.28); latchRig(0.28);

const lock = grp('lockPlate', caseG);
box(lock, 'lockBack', 0.072, 0.058, 0.006, M.iron, [0, 0.128, FZ + 0.002]);
box(lock, 'lockShoulder', 0.072, 0.010, 0.010, M.iron, [0, 0.156, FZ + 0.004]);
for (const sx of [-1, 1]) for (const sy of [-1, 1])
  sph(lock, 'lockRivet', 0.0045, M.brass, [sx * 0.027, 0.128 + sy * 0.020, FZ + 0.006], 12);
cyl(lock, 'lockEscutcheon', 0.016, 0.016, 0.008, M.brass, [0, 0.124, FZ + 0.005], [Math.PI / 2, 0, 0], 28);
cyl(lock, 'lockBore', 0.0045, 0.0045, 0.008, M.iron, [0, 0.128, FZ + 0.0035], [Math.PI / 2, 0, 0], 14);
box(lock, 'lockSlot', 0.004, 0.010, 0.008, M.iron, [0, 0.120, FZ + 0.0035]);
sph(lock, 'lockKeyTag', 0.006, M.brass, [0.030, 0.164, FZ + 0.006], 12);
for (const sx of [-1, 1]) for (const sy of [-1, 1])
  sph(handle, 'handleRivet', 0.0035, M.brass, [sx * 0.055, 0.150 + sy * 0.013, FZ + 0.014], 12);

/* ---------- lid ---------- */
const lid = grp('lid', root);
lid.position.set(0, TOP, -CD / 2 + 0.01);
lid.rotation.x = -0.30;
const LH = CD * 0.92;
box(lid, 'lidPanel', CW, LH, 0.024, M.caseWood, [0, LH / 2, -0.012]);
box(lid, 'lidRimTop', CW, 0.020, 0.030, M.caseWood, [0, LH - 0.01, 0.008]);
for (const sx of [-1, 1]) box(lid, 'lidRimSide', 0.020, LH, 0.030, M.caseWood, [sx * (CW / 2 - 0.01), LH / 2, 0.008]);
const lidFace = grp('lidInterior', lid);
const windowPane = box(lidFace, 'lidLining', CW - 0.05, LH - 0.05, 0.004, M.lining, [0, LH / 2, 0.0035]);
noCast(windowPane);
box(lidFace, 'lidMat', CW - 0.03, LH - 0.03, 0.004, M.caseWood, [0, LH / 2, 0.0028]);

const baro = grp('barometer', lidFace);
baro.position.set(0.245, 0.305, 0.006);
box(baro, 'baroBracket', 0.040, 0.040, 0.010, M.caseWood, [0, 0, -0.002]);
cyl(baro, 'baroDial', 0.048, 0.048, 0.008, M.linenPale, [0, 0, 0.006], [Math.PI / 2, 0, 0], 40);
torus(baro, 'baroBezel', 0.050, 0.0055, M.brass, [0, 0, 0.010], null, Math.PI * 2, 44);
for (let i = 0; i < 24; i++) {
  const a = i * Math.PI / 12, major = i % 2 === 0;
  const r = major ? 0.038 : 0.041, len = major ? 0.011 : 0.006;
  box(baro, 'baroTick', 0.0022, len, 0.002, M.iron, [Math.sin(a) * r, Math.cos(a) * r, 0.0105], [0, 0, -a]);
}
const needle = grp('baroNeedle', baro);
needle.position.set(0, 0, 0.0125); needle.rotation.z = -0.75;
box(needle, 'baroNeedleBlade', 0.0028, 0.050, 0.0016, M.iron, [0, 0.016, 0]);
box(needle, 'baroNeedleTail', 0.0045, 0.014, 0.0016, M.iron, [0, -0.008, 0]);
const setHand = grp('baroSetHand', baro);
setHand.position.set(0, 0, 0.0140); setHand.rotation.z = 1.15;
box(setHand, 'baroSetBlade', 0.0016, 0.054, 0.0012, M.brass, [0, 0.019, 0]);
cyl(baro, 'baroHub', 0.005, 0.005, 0.008, M.brass, [0, 0, 0.0155], [Math.PI / 2, 0, 0], 16);
noCast(cyl(baro, 'baroGlass', 0.047, 0.047, 0.002, M.glass, [0, 0, 0.0175], [Math.PI / 2, 0, 0], 40));

const plate = grp('makersPlate', lidFace);
plate.position.set(0.300, 0.372, 0.006);
box(plate, 'plateBody', 0.078, 0.026, 0.004, M.brass, [0, 0, 0]);
for (let i = 0; i < 3; i++)
  box(plate, 'plateEngraving', 0.052 - i * 0.014, 0.0022, 0.004, M.iron, [0, 0.007 - i * 0.007, 0.0012]);
for (const sx of [-1, 1]) sph(plate, 'plateScrew', 0.0035, M.brass, [sx * 0.033, 0, 0.0028], 12);

/* ---------- instrument deck + flaps ---------- */
const deck = grp('deck', root);
box(deck, 'deckBoard', CW - 0.008, 0.024, 0.225, M.paleWood, [0, TOP, -0.105]);
box(deck, 'deckLip', CW - 0.008, 0.010, 0.014, M.paleWood, [0, TOP + 0.014, 0.0005]);

const flap = (sx, name) => {
  const g = grp(name, root);
  g.position.set(sx * (CW / 2 - 0.008), TOP - 0.012, -0.05);
  g.rotation.z = sx * 0.05;
  box(g, name + 'Panel', 0.30, 0.016, 0.32, M.paleWood, [sx * 0.15, 0, 0]);
  box(g, name + 'EdgeOuter', 0.016, 0.024, 0.324, M.caseWood, [sx * 0.294, 0, 0]);
  for (const sz of [-1, 1]) box(g, name + 'EdgeSide', 0.304, 0.024, 0.016, M.caseWood, [sx * 0.152, 0, sz * 0.153]);
  box(g, name + 'Hinge', 0.02, 0.014, 0.10, M.brass, [sx * 0.008, 0.004, 0]);
  return g;
};
flap(-1, 'flapLeft'); flap(1, 'flapRight');

/* ---------- gramophone horn ---------- */
const hornG = grp('gramophoneHorn', root);
hornG.position.set(-0.27, TOP + 0.012, -0.14);
cyl(hornG, 'hornFoot', 0.032, 0.038, 0.014, M.brass, [0, 0.007, 0]);
cyl(hornG, 'hornPost', 0.008, 0.010, 0.22, M.brass, [0, 0.12, 0]);
cyl(hornG, 'hornCollar', 0.014, 0.014, 0.012, M.brass, [0, 0.155, 0]);
const hornArm = grp('hornArm', hornG);
hornArm.position.set(0, 0.23, 0);
hornArm.rotationQuaternion = BABYLON.Quaternion.RotationYawPitchRoll(-Math.PI / 2, 0, -0.85);
cyl(hornArm, 'hornNeck', 0.011, 0.014, 0.10, M.brass, [0, 0.05, 0]);
const hornPts = [];
for (let i = 0; i <= 16; i++) { const t = i / 16; hornPts.push([0.014 + 0.088 * Math.pow(t, 2.4), 0.20 * t]); }
lathe(hornArm, 'hornBell', hornPts, 48, M.brass, [0, 0.10, 0]);
torus(hornArm, 'hornRim', 0.101, 0.005, M.brass, [0, 0.30, 0], [Math.PI / 2, 0, 0], Math.PI * 2, 48);

/* ---------- bell jar with the captive cloud ---------- */
const jarG = grp('bellJar', root);
jarG.position.set(-0.09, TOP + 0.012, -0.10);
cyl(jarG, 'jarBase', 0.082, 0.088, 0.024, M.caseWood, [0, 0.012, 0]);
cyl(jarG, 'jarBaseRing', 0.086, 0.086, 0.006, M.brass, [0, 0.026, 0]);
const jarPts = [];
const domeR = (t) => Math.sqrt(Math.max(0, 1 - Math.pow(t, 6)));
const R_OUT = 0.066, H_OUT = 0.150, WALL = 0.0045;
for (let i = 0; i <= 40; i++) { const t = i / 40; jarPts.push([Math.max(0.0006, R_OUT * domeR(t)), H_OUT * t]); }
for (let i = 40; i >= 0; i--) { const t = i / 40; jarPts.push([Math.max(0.0003, (R_OUT - WALL) * domeR(t)), H_OUT * t - WALL]); }
jarPts.push([R_OUT, 0]);
const glassJarMat = pbr('jarGlass', 0xdfe6e6, 0.08, 0.05, { alpha: 0.22, double: true, noDepth: true });
noCast(lathe(jarG, 'jarGlass', jarPts, 64, glassJarMat, [0, 0.030, 0]));
const jarPickMat = pbr('jarPick', 0xffffff, 1, 0, { alpha: 0 });
const jarPickBox = cyl(jarG, 'jarPickTarget', 0.082, 0.082, 0.200, jarPickMat, [0, 0.100, 0], null, 12);
jarPickBox.visibility = 0; jarPickBox.isPickable = true; noCast(jarPickBox);
jarPickBox.receiveShadows = false;

const cloudG = grp('jarCloud', jarG);
cloudG.position.set(0, 0.070, 0);
const cloudMesh = BABYLON.MeshBuilder.CreateSphere('cloudMass', { diameter: 0.060, segments: 44, updatable: true }, scene);
finish(cloudMesh, 'cloudMass', cloudG, M.cloud, [0, 0, 0]);
noCast(cloudMesh);
cloudMesh.scaling.set(1.10, 0.82, 1.02);
const cArr = cloudMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
const cIdx = cloudMesh.getIndices();
const cCount = cArr.length / 3;
const cPosArr = new Float32Array(cArr);
const cNrm = new Float32Array(cArr.length);
const cDir = new Float32Array(cArr.length);
for (let i = 0; i < cCount; i++) {
  const x = cArr[i * 3], y = cArr[i * 3 + 1], z = cArr[i * 3 + 2];
  const l = Math.hypot(x, y, z) || 1;
  cDir[i * 3] = x / l; cDir[i * 3 + 1] = y / l; cDir[i * 3 + 2] = z / l;
}
const LOBES = [];
for (let i = 0; i < 7; i++) {
  const a = i * 2.399963, y = 1 - (i + 0.5) * 2 / 7, r = Math.sqrt(Math.max(0, 1 - y * y));
  LOBES.push({ x: Math.cos(a) * r, y: y * 0.6, z: Math.sin(a) * r, amp: 0.008 + 0.004 * ((i * 3) % 4) / 3, ph: i * 1.7 });
}

/* ---------- anemometer ---------- */

const HL = 0.070, HB = 0.0115, HD = 0.0105, HS = 0.0070;
const NU = 34, NT = 22;
{
  const hv = [], hidx = [];
  for (let i = 0; i <= NU; i++) {
    const u = -1 + 2 * i / NU;
    const taper = Math.pow(Math.max(0, 1 - u * u), 0.42) * (u > 0 ? Math.pow(1 - u * 0.55, 0.8) : 1);
    const B = HB * taper + 0.0006;
    const D = HD * (1 - 0.34 * u * u) * (u > 0.86 ? (1 - (u - 0.86) * 5) : 1);
    const S = HS * (0.30 + 0.70 * u * u * (u > 0 ? 1.25 : 1));
    for (let j = 0; j <= NT; j++) {
      const th = -Math.PI / 2 + Math.PI * j / NT;
      const st = Math.sin(th), ct = Math.cos(th);
      hv.push(u * HL / 2, S * Math.pow(Math.abs(st), 1.5) - D * Math.pow(ct, 1.25), B * st);
    }
  }
  for (let i = 0; i < NU; i++) for (let j = 0; j < NT; j++) {
    const a = i * (NT + 1) + j, b = a + 1, c = a + (NT + 1), d = c + 1;
    hidx.push(a, c, b, b, c, d);
  }
  const vd = new BABYLON.VertexData();
  vd.positions = hv; vd.indices = hidx; vd.normals = [];
  BABYLON.VertexData.ComputeNormals(hv, hidx, vd.normals);
  const m = new BABYLON.Mesh('boatHull', scene);
  vd.applyToMesh(m);
  noCast(finish(m, 'boatHull', boat, hullMat, [0, 0.010, 0]));
}

    const taper = Math.pow(Math.max(0, 1 - u * u), 0.42) * (u > 0 ? Math.pow(1 - u * 0.55, 0.8) : 1);
    const B = HB * taper + 0.0006;
    const S = HS * (0.30 + 0.70 * u * u * (u > 0 ? 1.25 : 1));
    gv.push(u * HL / 2, S, sz * B, u * HL / 2, S + 0.0016, sz * (B - 0.0008));
  }
  for (let i = 0; i < NU; i++) { const a = i * 2; gi.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  const vd = new BABYLON.VertexData();

  m.hasVertexAlpha = true;
};

  const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
  const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');

const aimRoomCam = () => {
  const f = towerFwd.clone();
  f.rotateByQuaternionToRef(BABYLON.Quaternion.RotationAxis(UPV, look.yaw), f);
  const right = BABYLON.Vector3.Cross(UPV, f).normalize();
  f.rotateByQuaternionToRef(BABYLON.Quaternion.RotationAxis(right, look.pitch), f);
  roomCam.position.copyFrom(towerSeat);
  roomCam.setTarget(towerSeat.add(f.scale(4)));
};

  towerMode = true;

  const outward = V3(0.30, 0, -0.95).normalize();
  const eye = V3(outward.x * 1.10, 11.56, outward.z * 1.10);

  aim.rotateByQuaternionToRef(BABYLON.Quaternion.RotationAxis(UPV, 0.16), aim);
  const look2 = V3(aim.x * 30, 11.10, aim.z * 30);
  const wm = tower.getWorldMatrix();
  towerSeat.copyFrom(BABYLON.Vector3.TransformCoordinates(eye, wm));
  towerFwd.copyFrom(BABYLON.Vector3.TransformCoordinates(look2, wm).subtract(towerSeat).normalize());
  look.yaw = 0; look.pitch = 0;

/* ---------- the flight the room is entered by ---------- */
let fly = null;
const ease = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const flyTo = (p, tg, dur, opts = {}) => {
  fly = { p0: camera.position.clone(), t0: camera.getTarget().clone(), p1: p.clone(), t1: tg.clone(),
    dur, el: 0, fov0: camera.fov, fov1: opts.fov === undefined ? camera.fov : opts.fov,
    veil: !!opts.veil, onDone: opts.onDone };
  camera.detachControl();
};
const flyTick = (dt) => {
  if (!fly) return;
  fly.el += dt;
  const u = Math.min(1, fly.el / fly.dur), e = ease(u);

const CLOUD_SOFT = hexc(0xf4f2ec), CLOUD_GUARD = hexc(0x9aa3ad);
const jarCloudMat = pbr('jarCloud', 0xf4f2ec, 1.0, 0.0, { alpha: 1, double: true });
cloudMesh.material = jarCloudMat;
const cloudMates = [];
for (let i = 0; i < 4; i++) {
  const m = cloudMesh.clone('cloudMate' + i);        // the same body, so they breathe together
  m.parent = cloudG; m.material = jarCloudMat; m.isVisible = false; m.isPickable = false;
  noCast(m);
  const a = i * 1.42, rr = 0.030 + 0.007 * (i % 2);
  m.metadata = { base: V3(Math.cos(a) * rr, -0.003 + 0.009 * Math.sin(a * 1.7), Math.sin(a) * rr), w: 0 };
  cloudMates.push(m);
}
// what falls inside the glass
const JR = 240;
const jarFallMat = new BABYLON.StandardMaterial('jarFall', scene);
jarFallMat.emissiveTexture = flakeTex; jarFallMat.opacityTexture = flakeTex;
jarFallMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
jarFallMat.specularColor = new BABYLON.Color3(0, 0, 0);
jarFallMat.disableLighting = true; jarFallMat.backFaceCulling = false;
jarFallMat.disableDepthWrite = true; jarFallMat.alpha = 0; jarFallMat.fogEnabled = false;
const jrp = new Float32Array(JR * 3), jrv = new Float32Array(JR);
for (let i = 0; i < JR; i++) {
  const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 0.046;
  jrp[i * 3] = Math.cos(a) * rr;
  jrp[i * 3 + 1] = -0.024 + Math.random() * 0.076;
  jrp[i * 3 + 2] = Math.sin(a) * rr;
  jrv[i] = 0.020 + Math.random() * 0.026;
}
const jarFallPos = new Float32Array(JR * 12);
let jarFall;
{
  const idx = [], uv = [];
  for (let i = 0; i < JR; i++) {
    const o = i * 4;
    idx.push(o, o + 1, o + 2, o, o + 2, o + 3);
    uv.push(0, 0, 1, 0, 1, 1, 0, 1);
  }
  const vd = new BABYLON.VertexData();
  vd.positions = jarFallPos; vd.indices = idx; vd.uvs = uv;
  vd.normals = new Float32Array(JR * 12);
  for (let i = 0; i < JR * 4; i++) vd.normals[i * 3 + 2] = 1;
  jarFall = new BABYLON.Mesh('jarFall', scene);
  vd.applyToMesh(jarFall, true);
  jarFall.material = jarFallMat; jarFall.parent = jarG;
  jarFall.position.set(0, 0.030, 0);
  jarFall.isPickable = false; jarFall.alwaysSelectAsActiveMesh = true;
  noCast(jarFall);
}

const chips = (list, key, sel, own) =>
  '<div class="opts">' + list.map((it, i) => {
    const label = Array.isArray(it) ? it[0] : it;
    const on = Array.isArray(sel) ? sel.includes(i) : sel === i;
    return '<button data-' + key + '="' + i + '"' + (on ? ' class="on"' : '') + '>' + label + '</button>';
  }).join('') +
  (own ? '<button data-own="1">내 말로 적기</button>' : '') + '</div>' +
  (own ? '<div class="mine"><input type="text" data-input="' + key + '" placeholder="내 말로 적기" maxlength="40"><button data-add="' + key + '">담기</button></div>' : '');

const ownWords = { load: [], react: [] };

const reactNames = () => A.react.map((i) => REACTS[i][1]).concat(ownWords.react.map((w) => w));

const renderStep = () => {
  if (cloudStep === 0) {
    cloudUI.innerHTML = '<p class="said">지금 내 상태에 영향을 주고 있는 것은<br>무엇인가요?</p>' +
      '<p class="ask">가까운 것을 모두 골라보세요</p>' + chips(LOADS, 'load', A.load, true) +
      '<div class="opts"><button data-go="1"' + (A.load.length + ownWords.load.length ? '' : ' disabled') + '>다음</button></div>' +
      '<p class="step">1 / 3</p>';
  } else if (cloudStep === 1) {
    cloudUI.innerHTML = '<p class="said">이것들의 영향을 받을 때<br>나는 주로 어떻게 하나요?</p>' +
      '<p class="ask">가까운 것을 모두 골라보세요</p>' + chips(REACTS, 'react', A.react, true) +
      '<div class="opts"><button data-go="2"' + (A.react.length + ownWords.react.length ? '' : ' disabled') + '>다음</button></div>' +
      '<p class="step">2 / 3</p>';
  } else if (cloudStep === 2) {
    cloudUI.innerHTML = '<p class="said">그렇게 했을 때<br>보통 어떻게 되나요?</p>' +
      chips(OUTCOMES, 'out', A.out, false) + '<p class="step">3 / 3</p>';
  } else {
    const names = loadNames();
    const joined = names.length > 1
      ? names.slice(0, -1).join(', ') + '과 ' + names[names.length - 1]
      : names[0];
    const react = reactNames().join(', ');
    cloudUI.innerHTML = '<p class="ask">관측 기록</p>' +
      '<p class="rec">' + joined + '의 영향을 받을 때 ' + react + '며,<br>' +
      '그 영향은 ' + (A.out >= 0 ? OUTCOMES[A.out][1] : '') + '.</p>' +
      '<div class="opts"><button data-done="1">관측 마치기</button>' +
      '<button class="ghost" data-again="1">다른 반응 시험하기</button></div>';
  }
  if (cloudStep > 0 && cloudStep < 3)
    cloudUI.innerHTML += '<div class="opts back"><button data-go="' + (cloudStep - 1) + '">이전 질문</button></div>';
  cloudUI.classList.add('show');
  requestAnimationFrame(() => cloudUI.classList.add('asking'));
};

const pickOne = (key, i, next) => { A[key] = i; applyAnswers(); cloudStep = next; renderStep(); };
cloudUI.addEventListener('click', (e) => {
  const t2 = e.target;
  const multi = (key) => {
    const b = t2.closest('button[data-' + key + ']');
    if (!b) return false;
    const i = +b.dataset[key], at = A[key].indexOf(i);
    if (at >= 0) A[key].splice(at, 1); else A[key].push(i);
    applyAnswers(); renderStep(); return true;
  };
  if (t2.closest('button[data-own]')) {
    cloudUI.classList.add('writing');
    const f = cloudUI.querySelector('input[data-input]');
    if (f) f.focus();
    return;
  }
  const add = t2.closest('button[data-add]');
  if (add) {
    const f = cloudUI.querySelector('input[data-input]');
    const v = f && f.value.trim();
    if (v) { ownWords[add.dataset.add].push(v); cloudUI.classList.remove('writing'); applyAnswers(); renderStep(); }
    return;
  }
  if (t2.closest('button[data-done]')) { leaveCloud(); return; }
  if (t2.closest('button[data-again]')) {
    A.react = []; A.out = -1; ownWords.react = [];
    cloudStep = 1; applyAnswers(); renderStep(); return;
  }
  const go = t2.closest('button[data-go]');
  if (go) { cloudStep = +go.dataset.go; renderStep(); return; }
  if (multi('load') || multi('react')) return;
  const k = t2.closest('button[data-knit]');
  if (k) { pickOne('knit', +k.dataset.knit, 2); return; }
  const fl = t2.closest('button[data-flow]');
  if (fl) { pickOne('flow', +fl.dataset.flow, 3); return; }
  const af = t2.closest('button[data-after]');
  if (af) { pickOne('after', +af.dataset.after, 5); return; }
  const la = t2.closest('button[data-later]');
  if (la) { pickOne('later', +la.dataset.later, 6); return; }
});
cloudUI.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const f = e.target.closest('input[data-input]');
  if (!f) return;
  const v = f.value.trim();
  if (v) { ownWords[f.dataset.input].push(v); cloudUI.classList.remove('writing'); applyAnswers(); renderStep(); }
});

/* ---------- coming close to the glass, and stepping back ---------- */
const enterCloud = () => {
  if (anyRoom() || cloudMode || busy() || cloudBusy) return;
  cloudBusy = true;
  saveHome();
  jarG.computeWorldMatrix(true);
  const c = BABYLON.Vector3.TransformCoordinates(V3(0, 0.075, 0), jarG.getWorldMatrix());
  const eye = c.add(V3(0.055, 0.045, 0.180));
  flyTo(eye, c, 1.6, { onDone: () => {
    cloudMode = true; cloudBusy = false;
    cloudStep = 0;
    A.load = []; A.react = []; A.out = -1; cloudCycle = false;
    ownWords.load = []; ownWords.react = [];
    CS.size = 0.42; CS.dens = 0.42; CS.count = 0; CS.fall = 2; CS.speed = 0.4;
    renderStep();
    exitBtn.textContent = '관측소로 돌아가기';
    exitBtn.classList.add('show');
  }});
};
const leaveCloud = () => {
  if (!cloudMode || cloudBusy) return;
  cloudBusy = true;
  cloudUI.classList.remove('asking');
  setTimeout(() => {
    cloudUI.classList.remove('show', 'writing');
    cloudMode = false; cloudBusy = false;
    exitBtn.classList.remove('show');
    restoreHome();
  }, 420);
};
window.enterCloud = enterCloud;
window.leaveCloud = leaveCloud;

const cloudTick = (t, dt) => {
  const k = Math.min(1, dt * 2.2);
  CSN.size += (CS.size - CSN.size) * k;
  CSN.dens += (CS.dens - CSN.dens) * k;
  CSN.speed += (CS.speed - CSN.speed) * k;
  cloudG.scaling.setAll(0.70 + 0.80 * CSN.size);
  const wantMates = MATES[CS.count];
  for (let i = 0; i < cloudMates.length; i++) {
    const m = cloudMates[i], md = m.metadata;
    md.w += ((i < wantMates ? 1 : 0) - md.w) * Math.min(1, dt * 3.0);
    m.isVisible = md.w > 0.02;
    if (m.isVisible) {
      const w = md.w, sw = 0.35 + 0.45 * w;
      const pack = 1 - 0.55 * CSN.size;          // crowded together once the jar is full
      m.position.set(md.base.x * w * pack, md.base.y * w * pack, md.base.z * w * pack);
      m.scaling.set(sw * 1.05, sw * 0.78, sw * 0.98);
      m.rotation.y = t * 0.10 * (i % 2 ? 1 : -1);
    }
  }
  jarCloudMat.alpha = 0.32 + 0.68 * CSN.dens;
  jarCloudMat.baseColor = BABYLON.Color3.Lerp(CLOUD_SOFT, CLOUD_GUARD, 0.10 + 0.50 * CSN.dens);
  cloudG.rotation.y += dt * (0.06 + 0.34 * CSN.speed);
  if (cloudCycle) {                             // eases down, then swells back
    const w = 0.5 - 0.5 * Math.cos(t * 0.26);
    cloudG.scaling.scaleInPlace(1 + 0.16 * (w - 0.5) * 0.001);
  }
  // snow settles slowly; rain runs down; neither means it stays inside
  const eff = CS.fall === 3 ? (Math.sin(t * 0.33) > 0 ? 1 : 2) : CS.fall;
  const isRain = eff === 2, falling = eff !== 0;
  jarFallMat.alpha += ((falling ? (isRain ? 0.52 : 0.46) : 0) - jarFallMat.alpha) * Math.min(1, dt * 1.8);
  jarFall.isVisible = jarFallMat.alpha > 0.02;
  if (jarFall.isVisible) {
    const v = (isRain ? 3.2 : 0.85) * (0.35 + 1.5 * CSN.speed);
    for (let i = 0; i < JR; i++) {
      jrp[i * 3 + 1] -= jrv[i] * dt * v;
      if (!isRain) jrp[i * 3] += Math.sin(t * 1.4 + i) * 0.00004;
      if (jrp[i * 3 + 1] < -0.026) {
        const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * 0.048;
        jrp[i * 3] = Math.cos(a) * rr; jrp[i * 3 + 1] = 0.052; jrp[i * 3 + 2] = Math.sin(a) * rr;
      }
    }
    const wm = scene.activeCamera.getWorldMatrix();
    const q = isRain ? 0.0011 : 0.0019;
    const rx = wm.m[0] * q, ry = wm.m[1] * q, rz = wm.m[2] * q;
    const ux = wm.m[4] * q * (isRain ? 2.6 : 1), uy = wm.m[5] * q * (isRain ? 2.6 : 1), uz = wm.m[6] * q * (isRain ? 2.6 : 1);
    for (let i = 0; i < JR; i++) {
      const o = i * 3, p = i * 12;
      const x = jrp[o], y = jrp[o + 1], z = jrp[o + 2];
      jarFallPos[p] = x - rx - ux; jarFallPos[p + 1] = y - ry - uy; jarFallPos[p + 2] = z - rz - uz;
      jarFallPos[p + 3] = x + rx - ux; jarFallPos[p + 4] = y + ry - uy; jarFallPos[p + 5] = z + rz - uz;
      jarFallPos[p + 6] = x + rx + ux; jarFallPos[p + 7] = y + ry + uy; jarFallPos[p + 8] = z + rz + uz;
      jarFallPos[p + 9] = x - rx + ux; jarFallPos[p + 10] = y - ry + uy; jarFallPos[p + 11] = z - rz + uz;
    }
    jarFall.updateVerticesData(BABYLON.VertexBuffer.PositionKind, jarFallPos);
  }
};

/* ---------- the recorder's own hand ---------- */
let chartX = 0, chartLast = -1, chartT = 0, chartPrev = '';
const chartRule = (x0, x1) => {
  chartCtx.fillStyle = '#eee7d4';
  chartCtx.fillRect(x0, 0, x1 - x0, 256);
  chartCtx.strokeStyle = 'rgba(150,126,96,0.22)';
  chartCtx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    chartCtx.beginPath();
    chartCtx.moveTo(x0, i * 256 / 6);
    chartCtx.lineTo(x1, i * 256 / 6);
    chartCtx.stroke();
  }
};
chartRule(0, 1024);
const chartTick = (t, dt) => {
  chartT += dt;
  if (chartT < 0.09) return;                     // the drum turns slowly
  chartT = 0;
  const S = SEA[WX.sea];
  const key = WX.sea + '|' + WX.precip;
  const level = 128 - (S.amp - 1) * 46 - (WX.precip === 'rain' ? 24 : WX.precip === 'snow' ? -18 : 0)
    + Math.sin(chartX * 0.11) * 7 + (Math.random() - 0.5) * 4;
  const nx = (chartX + 2) % 1024;
  if (nx < chartX) chartLast = -1;               // the roll comes round again
  chartRule(nx, Math.min(1024, nx + 26));
  if (chartLast >= 0) {
    chartCtx.strokeStyle = '#2f2a22';
    chartCtx.lineWidth = 2;
    chartCtx.beginPath();
    chartCtx.moveTo(chartX, chartLast);
    chartCtx.lineTo(nx, level);
    chartCtx.stroke();
  }
  if (key !== chartPrev) {                       // every change of weather is entered
    chartPrev = key;
    chartCtx.strokeStyle = 'rgba(120,70,30,0.75)';
    chartCtx.lineWidth = 1.5;
    chartCtx.beginPath(); chartCtx.moveTo(nx, 18); chartCtx.lineTo(nx, 238); chartCtx.stroke();
    chartCtx.fillStyle = 'rgba(90,60,30,0.85)';
    chartCtx.fillRect(nx + 3, 22, 7, 3);
    chartCtx.fillRect(nx + 3, 28, 11, 3);
    chartCtx.fillRect(nx + 3, 34, 5, 3);
  }
  chartX = nx; chartLast = level;
  chartTex.update(false);
};

/* ---------- the ride, and the deep ---------- */
const sandTmp = new BABYLON.Vector3();
const sandTick = (t, dt) => {
  if (!sandRide) return;
  // she makes way in fits and starts, and the heading wanders on her own
  const stall = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * 1.7) * Math.sin(t * 0.63));
  helm.head += (helm.steer * 0.42 + 0.16 * Math.sin(t * 0.51) + 0.07 * Math.sin(t * 1.31)) * dt;
  const v = helm.speed * stall * dt;
  helm.x += Math.sin(helm.head) * v;
  helm.z += Math.cos(helm.head) * v;
  const lim = SD / 2 - 40;
  helm.x = Math.max(-lim, Math.min(lim, helm.x));
  helm.z = Math.max(-lim, Math.min(lim, helm.z));
  rideBoat.position.set(helm.x, duneAt(helm.x, helm.z) + 0.62 + 0.10 * Math.sin(t * 3.1), helm.z);
  rideBoat.rotation.y = helm.head - Math.PI / 2;   // the hull runs along its own +x
  rideDeck.rotation.z = -0.10 + 0.09 * Math.sin(t * 2.4) + 0.04 * Math.sin(t * 10.5) * stall;
  rideDeck.rotation.x = 0.05 * Math.sin(t * 1.9);
  // the helm seat, and the head that turns from it
  const hx = Math.sin(helm.head), hz = Math.cos(helm.head);
  const ang = helm.head + look.yaw;
  const fwd = V3(Math.sin(ang), 0, Math.cos(ang));
  const px = Math.cos(helm.head), pz = -Math.sin(helm.head);   // to starboard
  const seat = V3(helm.x - hx * 1.9 + px * 0.52, duneAt(helm.x, helm.z) + 2.05 + 0.10 * Math.sin(t * 3.1), helm.z - hz * 1.9 + pz * 0.52);
  seat.y += duneAt(seat.x, seat.z) * 0.0;
  roomCam.position.copyFrom(seat);
  sandTmp.copyFrom(seat).addInPlace(fwd.scale(12));
  sandTmp.y += look.pitch * 12 - 0.9;
  roomCam.setTarget(sandTmp);
  // sand streaming past
  for (let i = 0; i < sandBlow.length; i++) {
    const g = sandBlow[i];
    g.d -= (2.6 + g.sp2 * 5) * dt;
    if (g.d < 4) { g.d = 46 + Math.random() * 12; g.lat = (Math.random() - 0.5) * 46; }
    const a = helm.head + 0.2 * Math.sin(t * 0.7 + g.ph);
    g.sp.position.set(helm.x + Math.sin(a) * g.d + Math.cos(a) * g.lat,
      g.y + 0.35 * Math.sin(t * 1.4 + g.ph),
      helm.z + Math.cos(a) * g.d - Math.sin(a) * g.lat);
    g.sp.width = g.w; g.sp.height = g.h;
    g.sp.color.a = 0.16 + 0.24 * (0.5 + 0.5 * Math.sin(t * 1.1 + g.ph));
  }
  farBeacon.rotation.y += dt * 0.30;
};

const deepTick = (t, dt) => {
  // the surface overhead, always trembling
  {
    const p = ceilField.pos, b = ceilField.base;
    for (let i = 0; i < p.length; i += 3)
      p[i + 2] = 0.0022 * Math.sin(b[i] * 60 + t * 3.4) + 0.0016 * Math.sin(b[i + 1] * 44 - t * 2.6);
    if (diveMode) pushPlane(ceilField);
  }
  if (!diveMode) return;
  for (let i = 0; i < MOTES; i++) {
    const o = i * 3;
    mp[o + 1] += mv[i] * dt;
    mp[o] += Math.sin(t * 0.9 + mph[i]) * 0.004 * dt;
    if (mp[o + 1] > -0.004) {
      mp[o + 1] = -ABYSS_D;
      mp[o] = (Math.random() - 0.5) * 0.255;
      mp[o + 2] = (Math.random() - 0.5) * 0.175;
    }
  }
  {
    const wm = roomCam.getWorldMatrix();
    const rx = wm.m[0] * 0.0021, ry = wm.m[1] * 0.0021, rz = wm.m[2] * 0.0021;
    const ux = wm.m[4] * 0.0021, uy = wm.m[5] * 0.0021, uz = wm.m[6] * 0.0021;
    for (let i = 0; i < MOTES; i++) {
      const o = i * 3, q = i * 12;
      const x = mp[o], y = mp[o + 1], z = mp[o + 2];
      motePos[q] = x - rx - ux; motePos[q + 1] = y - ry - uy; motePos[q + 2] = z - rz - uz;
      motePos[q + 3] = x + rx - ux; motePos[q + 4] = y + ry - uy; motePos[q + 5] = z + rz - uz;
      motePos[q + 6] = x + rx + ux; motePos[q + 7] = y + ry + uy; motePos[q + 8] = z + rz + uz;
      motePos[q + 9] = x - rx + ux; motePos[q + 10] = y - ry + uy; motePos[q + 11] = z - rz + uz;
    }
    motes.updateVerticesData(BABYLON.VertexBuffer.PositionKind, motePos);
  }
  for (let i = 0; i < rays.length; i++) {
    const r = rays[i];
    r.m.visibility = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 1.3 + r.ph));
    r.m.rotation.y += dt * 0.05;
  }
  for (let i = 0; i < shades.length; i++) {
    const s = shades[i], w = t * s.sp + s.ph;
    s.s.position.x = Math.sin(w) * 0.105 * s.dir;
    s.s.position.z = Math.cos(w * 0.7) * 0.062;
    s.s.position.y = s.y + Math.sin(w * 0.5) * 0.05;
    s.s.rotation.y = Math.atan2(-Math.sin(w * 0.7) * 0.062, Math.cos(w) * 0.105 * s.dir);
  }
  glowMat.alpha = 0.30 + 0.16 * Math.sin(t * 0.8);
  // swimming, clamped inside the shaft
  if (swim.f || swim.up) {
    const dir = roomCam.getTarget().subtract(roomCam.position).normalize().scale(swim.f * dt * 0.26);
    dir.y += swim.up * dt * 0.26;
    towerSeat.addInPlace(dir);
  }
  const loc = BABYLON.Vector3.TransformCoordinates(towerSeat, BABYLON.Matrix.Invert(wd.getWorldMatrix()));
  loc.x = Math.max(-0.115, Math.min(0.115, loc.x));
  loc.z = Math.max(0.229 - 0.076, Math.min(0.229 + 0.076, loc.z));
  loc.y = Math.max(-ABYSS_D + 0.07, Math.min(-0.030, loc.y));
  towerSeat.copyFrom(BABYLON.Vector3.TransformCoordinates(loc, wd.getWorldMatrix()));
  aimRoomCam();
};

let playing = null, playAt = 0, spinNow = 0;
const recordVoice = (key) => {
  const s = voiceState[key];
  if (!s || s.armed) return;
  s.armed = true;
};
const playVoices = () => {
  const armed = VOICES.filter((v) => voiceState[v.key].armed);
  if (!armed.length) {
    voiceBox.innerHTML = '<span class="who">청음기</span><p class="said">아직 아무것도 기록되지 않았습니다.</p>';
    voiceBox.classList.add('show');
    clearTimeout(playAt);
    playAt = setTimeout(() => voiceBox.classList.remove('show'), 2600);
    return;
  }
  let i = 0;
  const step = () => {
    if (i >= armed.length) {
      voiceBox.classList.remove('show');
      playing = null;
      return;
    }
    const v = armed[i++];
    voiceState[v.key].glow = 1;
    voiceBox.classList.remove('show');

      voiceBox.innerHTML = '<span class="who">' + v.label + '</span><p class="said">' + v.line + '</p>';
      voiceBox.classList.add('show');

};

/* ---------- animation ---------- */
let last = performance.now(), frame = 0;
const t0 = performance.now();
scene.onBeforeRenderObservable.add(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = (now - t0) * 0.00042;
  const S = SEA[WX.sea];
  const ts = t * S.speed;
  frame++;

  if (!anyRoom() && scene.activeCamera !== camera) scene.activeCamera = camera;
  flyTick(dt);
  sandTick(t, dt);
  chartTick(t, dt);
  cloudTick(t, dt);
  buoyTick(t, dt);
  deepTick(t, dt);
  seaWindow.setVector2('uRes', new BABYLON.Vector2(engine.getRenderWidth(), engine.getRenderHeight()));
  portalCam.position.copyFrom(camera.position);
  portalCam.setTarget(camera.getTarget());
  rain.isVisible = (WX.precip === 'rain');
  snow.isVisible = (WX.precip === 'snow');

  // the open swell
  if (frame % 2 === 0) {
    const p = S_.pos, b = S_.base;
    for (let i = 0; i < p.length; i += 3) {
      const x = b[i], y = b[i + 1];
      p[i + 2] = S.amp * (
        Math.sin(x * 0.55 + ts * 2.1) * 0.10 +
        Math.sin(y * 0.42 - ts * 1.6) * 0.13 +
        Math.sin((x + y) * 0.20 + ts * 1.1) * 0.20 +
        Math.sin((x * 0.9 - y * 1.3) * 0.9 + ts * 3.4) * 0.03);
    }
    pushPlane(S_);
    flipPlane(S_);
  }

  // rain / snow
  if (WX.precip === 'rain') {
    const slant = 0.10 + (S.amp - 1) * 0.06;
    for (let i = 0; i < DROPS; i++) {
      const d = rv[i] * dt, o = i * 6;
      rp[o + 1] -= d; rp[o + 4] -= d;
      rp[o] += d * slant; rp[o + 3] += d * slant;
      if (rp[o + 4] < -0.7) {
        const x = (Math.random() - 0.5) * FIELD, z = (Math.random() - 0.5) * FIELD - 0.6;
        const len = 0.026 + Math.random() * 0.040;
        rp[o] = x; rp[o + 1] = TOPY; rp[o + 2] = z;
        rp[o + 3] = x + 0.006; rp[o + 4] = TOPY - len; rp[o + 5] = z;
      }
    }
    rain.updateVerticesData(BABYLON.VertexBuffer.PositionKind, rp);
  } else if (WX.precip === 'snow') {
    for (let i = 0; i < FLAKES; i++) {
      const o = i * 3;
      sp[o + 1] -= sv[i] * dt;
      sp[o] += (0.05 + Math.sin(t * 2.0 + sph_[i]) * 0.06) * dt;
      sp[o + 2] += Math.cos(t * 1.5 + sph_[i] * 1.7) * 0.05 * dt;
      if (sp[o + 1] < -0.7) {
        sp[o] = (Math.random() - 0.5) * FIELD;
        sp[o + 1] = TOPY;
        sp[o + 2] = (Math.random() - 0.5) * FIELD - 0.6;
      }
    }
    const wm = camera.getWorldMatrix();
    const rx = wm.m[0] * 0.014, ry = wm.m[1] * 0.014, rz = wm.m[2] * 0.014;
    const ux = wm.m[4] * 0.014, uy = wm.m[5] * 0.014, uz = wm.m[6] * 0.014;
    for (let i = 0; i < FLAKES; i++) {
      const o = i * 3, q = i * 12;
      const x = sp[o], y = sp[o + 1], z = sp[o + 2];
      snowPos[q]      = x - rx - ux; snowPos[q + 1]  = y - ry - uy; snowPos[q + 2]  = z - rz - uz;
      snowPos[q + 3]  = x + rx - ux; snowPos[q + 4]  = y + ry - uy; snowPos[q + 5]  = z + rz - uz;
      snowPos[q + 6]  = x + rx + ux; snowPos[q + 7]  = y + ry + uy; snowPos[q + 8]  = z + rz + uz;
      snowPos[q + 9]  = x - rx + ux; snowPos[q + 10] = y - ry + uy; snowPos[q + 11] = z - rz + uz;
    }
    snow.updateVerticesData(BABYLON.VertexBuffer.PositionKind, snowPos);
  }

  // instruments turning in the wind
  const gust = (0.6 + 0.5 * S.amp) * (1 + 0.35 * Math.sin(t * 2.3) + 0.15 * Math.sin(t * 7.1));
  cups.rotation.y -= dt * 3.4 * gust;
  disc.rotation.z -= dt * 1.9 * gust;
  sockBody.rotation.z = Math.PI / 2 - 0.12 + 0.07 * Math.sin(t * 3.1);
  sockBody.rotation.y = 0.10 * Math.sin(t * 2.2);

  // the captive cloud
  if (frame % 3 === 0) {
    for (let i = 0; i < cCount; i++) {
      const nx = cDir[i * 3], ny = cDir[i * 3 + 1], nz = cDir[i * 3 + 2];
      let r = 0.024;
      for (let j = 0; j < LOBES.length; j++) {
        const L = LOBES[j];
        const d = nx * L.x + ny * L.y + nz * L.z - 0.15;
        if (d > 0) r += d * d * L.amp * 2.2 * (1 + 0.30 * Math.sin(t * 1.6 + L.ph));
      }
      r += 0.0022 * Math.sin(nx * 3.1 + t * 1.4) * Math.cos(ny * 2.6 - t * 1.1)
         + 0.0016 * Math.sin(nz * 3.7 - t * 0.9) * Math.cos(nx * 2.2 + t * 1.3);
      if (r > 0.042) r = 0.042;
      let vy = ny * r;
      if (vy < -0.007) vy = -0.007 + (vy + 0.007) * 0.30;
      // the glass is the limit: as it grows the cloud packs against the dome
      let vx = nx * r, vz = nz * r;
      const gsc = cloudG.scaling.x;
      let jy = 0.070 + vy * gsc;
      if (jy > 0.1445) { jy = 0.1445; vy = (jy - 0.070) / gsc; }
      if (jy < 0.004) { jy = 0.004; vy = (jy - 0.070) / gsc; }
      const rr = Math.hypot(vx, vz) * gsc;
      const tt = jy / 0.150;
      const rmax = 0.0615 * Math.sqrt(Math.max(0, 1 - Math.pow(tt, 6))) - 0.0028;
      if (rr > rmax && rr > 1e-6) { const f = rmax / rr; vx *= f; vz *= f; }
      cPosArr[i * 3] = vx; cPosArr[i * 3 + 1] = vy; cPosArr[i * 3 + 2] = vz;
    }
    cloudMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, cPosArr);
    BABYLON.VertexData.ComputeNormals(cPosArr, cIdx, cNrm);
    cloudMesh.updateVerticesData(BABYLON.VertexBuffer.NormalKind, cNrm);
  }
  cloudG.position.y = 0.070 + 0.004 * Math.sin(t * 1.9);
  cloudG.rotation.y += dt * 0.16;

  // the beacon sweeping the water
  beamCtl.rN += (beamCtl.reach - beamCtl.rN) * Math.min(1, dt * 2.2);
  beamCtl.sN += (beamCtl.speed - beamCtl.sN) * Math.min(1, dt * 2.2);
  beacon.rotation.y += dt * (0.05 + 1.05 * beamCtl.sN);
  lens.rotation.y = beacon.rotation.y;
  {
    const k = 0.34 + 1.05 * beamCtl.rN;         // how far the light carries
    const w = 0.55 + 0.85 * beamCtl.rN;
    for (let i = 0; i < beamCones.length; i++) {
      const b = beamCones[i], dir = i === 0 ? 1 : -1;
      b.scaling.set(w, k, w);
      b.position.x = dir * (BEAM_NEAR + BEAM_LEN * k / 2);
    }
    beaconLight.range = 18 + 44 * beamCtl.rN;
    reachLever.rotation.x = 0.62 - 1.24 * beamCtl.rN;
    speedWheel.rotation.z -= dt * (0.4 + 7.0 * beamCtl.sN);
    const cs = (0.85 + 0.75 * beamCtl.rN) * (1 + 0.05 * Math.sin(t * 9.0));
    beamCore.scaling.setAll(cs);
    beamCoreMat.alpha = (towerMode ? 0.12 : 0.22) * (0.85 + 0.15 * Math.sin(t * 9.0));
  }
  // the listening machine
  for (const k in voiceState) {
    const st = voiceState[k];
    const want = st.glow > 0 ? 2.6 : (st.armed ? 0.85 : 0.0);
    st.glow = Math.max(0, st.glow - dt * 0.28);
    st.mat.emissiveColor = hexc(st.v.hex).scale(want * (0.82 + 0.18 * Math.sin(t * 6.4)));
  }
  spinNow += ((playing ? 1 : 0) - spinNow) * Math.min(1, dt * 3);
  waxDrum.rotation.x += dt * 2.2 * spinNow;
  crank.rotation.x += dt * 2.2 * spinNow;
  fadeBeams(beamCones, towerMode ? 0.30 : 0.46);
  if (sandRide) fadeBeams(farBeams, 0.26);
  lampMat.emissiveColor = hexc(0xffd694).scale(towerMode ? 0.8 + 0.2 * Math.sin(t * 9.0) : 2.2 + 0.5 * Math.sin(t * 9.0));

  // the little sea in the open drawer
  {
    const p = W.pos, b = W.base;
    for (let i = 0; i < p.length; i += 3) {
      const x = b[i], y = b[i + 1];
      p[i + 2] = S.amp * (
        Math.sin(x * 52 + ts * 3.0) * 0.0034 +
        Math.sin(y * 38 - ts * 2.4) * 0.0026 +
        Math.sin((x + y) * 88 + ts * 4.6) * 0.0014 +
        Math.sin((x - y) * 150 - ts * 6.2) * 0.0006);
    }
    pushPlane(W);
  }

  // fog welling up inside the chamber, then spilling out of the open door
  const fogThin = 0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * 0.62) * Math.cos(t * 0.23));
  // the dust devil: wanders the floor, leans as it runs, spins fast
  devilState.x = Math.sin(t * 0.42) * 0.062 + Math.sin(t * 0.17) * 0.020;
  devilState.z = Math.cos(t * 0.31) * 0.048 + Math.sin(t * 0.63) * 0.012;
  devilState.sp += dt * 7.4;
  devil.position.set(devilState.x, 0.019, devilState.z);
  devil.rotation.z = 0.10 * Math.sin(t * 0.9);
  devilMat.alpha = 0.16 + 0.16 * fogThin;
  {
    const wm = (scene.activeCamera || camera).getWorldMatrix();
    const rx = wm.m[0], ry = wm.m[1], rz = wm.m[2];
    const ux = wm.m[4], uy = wm.m[5], uz = wm.m[6];
    for (let i = 0; i < grains.length; i++) {
      const g = grains[i], q = i * 12;
      g.t += dt * g.rise;
      if (g.t > 1) { g.t -= 1; g.a = Math.random() * Math.PI * 2; }
      g.a += dt * g.sp * (1.6 - g.t);
      const r = (0.005 + 0.026 * Math.pow(g.t, 1.30)) * g.jr;
      const lean = 0.026 * g.t;
      const x = Math.cos(g.a) * r + Math.cos(devilState.sp * 0.6) * lean;
      const y = 0.003 + g.t * 0.135;
      const z = Math.sin(g.a) * r + Math.sin(devilState.sp * 0.6) * lean;
      const s2 = g.sz * (0.55 + 0.85 * g.t);
      const ax = rx * s2, ay = ry * s2, az = rz * s2;
      const bx = ux * s2, by = uy * s2, bz = uz * s2;
      devilPos[q] = x - ax - bx; devilPos[q + 1] = y - ay - by; devilPos[q + 2] = z - az - bz;
      devilPos[q + 3] = x + ax - bx; devilPos[q + 4] = y + ay - by; devilPos[q + 5] = z + az - bz;
      devilPos[q + 6] = x + ax + bx; devilPos[q + 7] = y + ay + by; devilPos[q + 8] = z + az + bz;
      devilPos[q + 9] = x - ax + bx; devilPos[q + 10] = y - ay + by; devilPos[q + 11] = z - az + bz;
    }
    devilMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, devilPos);
  }
  devilFoot.scaling.setAll(1.1 + 0.25 * Math.sin(t * 3.1));
  for (let i = 0; i < fogPuffs.length; i++) {
    const p = fogPuffs[i];
    p.life += dt * p.speed;
    if (p.life >= 1) {
      p.life -= 1;
      p.x = (Math.random() - 0.5) * 0.14;
      p.z0 = -FD / 2 + 0.012 + Math.random() * 0.06;
      p.speed = 0.055 + Math.random() * 0.055;
    }
    const L = p.life, w = t * 1.1 + p.ph;
    const DOORC = 0;                            // the fog wells up and slips over the sill
    let x, y, z, sc, a;
    if (L < 0.52) {                             // drifting across the sand toward the doorway
      const u = L / 0.52;
      x = p.x + (DOORC - p.x) * u * 0.75 + Math.sin(w) * 0.012;
      y = 0.017 + u * 0.026 + Math.sin(w * 0.8) * 0.003;
      z = p.z0 + u * (FD / 2 - 0.02 - p.z0) + Math.cos(w * 0.7) * 0.008;
      sc = p.s * (0.70 + u * 0.40);
      a = p.op * Math.min(1, u * 4.5) * fogThin;
    } else {                                    // over the sill, then sinking across the desk
      const u = (L - 0.52) / 0.48;
      // it reaches the doorway, then settles back down onto the sand inside
      x = DOORC * 0.7 + Math.sin(w * 0.9) * 0.012 - u * 0.030;
      y = 0.034 - u * 0.022 + Math.sin(w * 1.3) * 0.002;
      z = FD / 2 - 0.024 - u * 0.055;
      sc = p.s * (1.05 + u * 0.55);
      a = p.op * 0.72 * (1 - u * u * 0.9) * (0.45 + 0.55 * fogThin);
    }
    p.sprite.position.set(fogAnchor.x + x, fogAnchor.y + y, fogAnchor.z + z);
    p.sprite.size = sc;
    p.sprite.color.a = a;
    p.sprite.angle = Math.sin(w * 0.4) * 0.6;
  }

  // the lost boat wandering
  const bt = t * 0.15;                          // aground: it barely makes way
  const bx = (u) => 0.036 * Math.sin(u * 0.9) + 0.009 * Math.sin(u * 2.3 + 1.1);
  const bz = (u) => 0.018 * Math.cos(u * 0.7) + 0.006 * Math.sin(u * 1.7) - 0.004;
  const x0 = bx(bt), z0 = bz(bt), x1 = bx(bt + 0.02), z1 = bz(bt + 0.02);
  boat.position.set(x0, 0.017 + chamberDune(x0, -z0) + 0.0016 * Math.sin(t * 3.4), z0);
  boat.rotation.y = Math.atan2(-(z1 - z0), (x1 - x0));
  boat.rotation.z = 0.05 * Math.sin(t * 2.7) - 0.06;
  boatLight.intensity = 0.075 + 0.03 * Math.sin(t * 6.1);
  for (let i = 0; i < fogFloor.length; i++) {
    const f = fogFloor[i], w = t * 0.8 + f.ph;
    f.sprite.position.x = fogAnchor.x + f.x + Math.sin(w) * 0.010;
    f.sprite.position.z = fogAnchor.z + f.z + Math.cos(w * 0.8) * 0.008;
    f.sprite.color.a = 0.30 + 0.30 * (0.5 + 0.5 * Math.sin(w * 1.2)) * fogThin;
  }
});

engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => {
  engine.resize();
  const s = rttSize();
  rtt.resize({ width: s.width, height: s.height });
});
</script>
</body>
