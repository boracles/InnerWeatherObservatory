<div id="roomMarkers" aria-label="관측할 방">
  <button type="button" class="room-marker" data-room="lighthouse">
    <span class="room-marker__state" aria-hidden="true"></span>
    <span class="room-marker__copy">
      <span class="room-marker__title">등대의 방</span>
      <span class="room-marker__part">계속 살피는 부분</span>
    </span>
    <span class="room-marker__rename" role="button" tabindex="0">이름 바꾸기</span>
  </button>
  <button type="button" class="room-marker" data-room="fog">
    <span class="room-marker__state" aria-hidden="true"></span>
    <span class="room-marker__copy">
      <span class="room-marker__title">안개의 방</span>
      <span class="room-marker__part">아직 이름 붙지 않은 부분</span>
    </span>
    <span class="room-marker__rename" role="button" tabindex="0">이름 바꾸기</span>
  </button>
  <button type="button" class="room-marker" data-room="wave">
    <span class="room-marker__state" aria-hidden="true"></span>
    <span class="room-marker__copy">
      <span class="room-marker__title">파도의 방</span>
      <span class="room-marker__part">당장 버티게 하는 부분</span>
    </span>
    <span class="room-marker__rename" role="button" tabindex="0">이름 바꾸기</span>
  </button>
</div>
